[project]
name = "vic-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Z.M. Vig", email = "zvig@umd.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "alphashape>=1.3.1",
    "click>=8.5.0",
    "cmap>=0.7.2",
    "cubio>=0.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pyside6>=6.11.2",
    "shapely>=2.1.2",
]

[project.scripts]
vic-analysis = "vic_analysis.ui.application:run"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
