[project]
name = "vic-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Z.M. Vig", email = "zvig@umd.edu" }
]
requires-python = ">=3.13, <3.14"
dependencies = [
    "alphashape>=1.3.1",
    "astropy>=8.0.1",
    "cameratransform>=1.2.1",
    "click>=8.5.0",
    "cmap>=0.7.2",
    "cubio>=0.1.3",
    "fiona>=1.10.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "pyside6==6.11.1",
    "pyside6-qtads>=5.0.0.2",
    "scikit-image>=0.26.0",
    "shapely>=2.1.2",
]

[project.scripts]
vic-analysis = "vic_analysis.ui.application:run"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["resources/**"]

[tool.ruff]
excldue = [
    "src/vic_analysis/resources/resources_rc.py"
]

[dependency-groups]
dev = [
    "rich>=15.0.0",
]
